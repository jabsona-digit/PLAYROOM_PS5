name: Generate Supabase Types

# Drift CHECK (not an auto-committer). When a migration changes the public schema,
# regenerate lib/database.types.ts and commit it IN THE SAME PR/commit as the migration.
# This job only verifies the committed types match the live DB — it never pushes to main
# (so it doesn't need a branch-protection bypass, and types stay atomic with their schema).
#
# If this fails: run locally and commit the result
#   npx supabase gen types typescript --project-id rvlkimzqzwizcivkxtnd --schema public > lib/database.types.ts

on:
  push:
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  gen-types:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Regenerate types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase gen types typescript \
            --project-id rvlkimzqzwizcivkxtnd \
            --schema public \
            > lib/database.types.ts

      - name: Fail if types drifted from the committed file
        run: |
          if ! git diff --quiet -- lib/database.types.ts; then
            echo "::error::lib/database.types.ts is out of sync with the live DB schema."
            echo "Regenerate and commit it alongside your migration:"
            echo "  npx supabase gen types typescript --project-id rvlkimzqzwizcivkxtnd --schema public > lib/database.types.ts"
            echo "--- drift ---"
            git --no-pager diff -- lib/database.types.ts
            exit 1
          fi
          echo "types in sync ✓"
